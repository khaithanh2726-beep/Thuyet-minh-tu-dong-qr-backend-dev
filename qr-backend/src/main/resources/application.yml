server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: qr-backend
  config:
    import: optional:file:./dev-local.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qr_audio_backend_dev?serverTimezone=UTC&sslMode=DISABLED}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
voicerss:
  api-key: ${VOICERSS_API_KEY:}
  url: https://api.voicerss.org/
audio:
  storage-dir: ${AUDIO_STORAGE_DIR:audio_cache}
app:
  public-base-url: ${PUBLIC_BASE_URL:}
  seed-demo-data: ${SEED_DEMO_DATA:false}
