version: '3.8'

services:
  # Cấu hình Database
  db:
    image: mysql:8.0
    container_name: qr-mysql
    environment:
      MYSQL_DATABASE: qr_audio_backend_dev
      MYSQL_ROOT_PASSWORD: Infineti2006.
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  #Cấu hình Backend
  app:
    build: .
    container_name: qr-backend-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/qr_audio_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

volumes:
  db_data: